# Container-only site. Host Nginx owns TLS; no public API/internal-engine ports.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 65m;
    # Homepage is reserved for the separately developed website.
    # Website login button targets /workspace/ after application acceptance.
    location = / { return 503; }
    location /api/ {
        proxy_pass http://api:18181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location /internal/ { return 404; }
    location /actuator/ { return 404; }
    location /workspace/ { try_files $uri $uri/ /workspace/index.html; }
    location /tenant-admin/ { try_files $uri $uri/ /tenant-admin/index.html; }
    location /platform-admin/ { try_files $uri $uri/ /platform-admin/index.html; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri =404; }
}
