*{box-sizing:border-box}body{margin:0;color:#24312f;background:#f7f8f7;font:15px/1.7 system-ui,-apple-system,'PingFang SC',sans-serif}a{color:inherit}header{height:64px;border-bottom:1px solid #e0e5e2;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:12px}header strong{font-size:17px}header span{font-size:12px;color:#7c8882}.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 64px)}#nav{padding:24px 16px;border-right:1px solid #e0e5e2;background:#fff;position:sticky;top:0;height:calc(100vh - 64px);overflow:auto}#nav a{display:block;padding:9px 12px;text-decoration:none;border-radius:6px;margin:3px 0;color:#65716a;font-size:14px}#nav a:hover{background:#f4f6f4}#nav a.active{background:#e8f0eb;color:#236249;font-weight:650}#nav .group{margin:22px 12px 9px;font-size:12px;color:#929b95}#nav .step{padding-left:18px}#nav .step b{font-size:12px;font-weight:400;display:inline-block;width:25px;color:#93a299}main{padding:36px clamp(22px,4vw,65px) 60px;max-width:1350px;width:100%;min-width:0}.breadcrumb{font-size:12px;color:#859087;margin-bottom:9px}h1{font-size:28px;letter-spacing:-.5px;line-height:1.35;margin:0}h2{font-size:19px;margin:30px 0 15px}h3{font-size:16px;margin:0 0 9px}p{margin:8px 0 15px}.heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px}.tag{font-size:11px;padding:3px 8px;background:#edf0ed;color:#788078;border-radius:4px;white-space:nowrap}.tag.ok{background:#e3eee6;color:#47765a}.tag.draft{background:#f4eddf;color:#94713c}.intro,.subtle{color:#7b867e;font-size:13px}.columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:26px}.column{padding:20px;background:white;border:1px solid #e2e7e3;border-radius:8px}.column.target{border-top:3px solid #559170;padding-top:18px}.column p{font-size:14px;color:#59655c;margin-bottom:0}.output{padding:14px 18px;border-left:3px solid #9fb8a6;background:#edf3ee;margin-top:2 n:10px 0}.pills span{font-size:12px;padding:4px 8px;background:#eef2ec;border-radius:4px}.footer{border-top:1px solid #e0e6e0;margin-top:36px;padding-top:12px;font-size:12px;color:#8a958b}a:focus-visible,summary:focus-visible{outline:3px solid #6e977c;outline-offset:3px}@media(max-width:1000px){.columns{grid-template-columns:1fr}.flow{grid-template-columns:repeat(2,1fr)}.flow a:after{display:none}}@media(max-width:700px){header{padding:12px 16px;height:auto;align-items:flex-start}header span{font-size:10px}.app{display:block}#nav{height:auto;position:static;border-right:0;border-bottom:1px solid #e0e5e2;display:flex;gap:4px;overflow:auto;padding:10px}#nav .group{display:none}#nav a,#nav .step{white-space:nowrap;padding:7px 10px;margin:0}#nav .step b{width:20px}main{padding:24px 16px}.heading{align-items:flex-start}h1{font-size:24px}.step-list{grid-template-columns:1fr}.columns{gap:10px}.wire{grid-template-columns:1fr}.wire nav{display:none}.body{padding:14px}.flow{gap:10px}.flow a{padding:16px}.stage summary{padding:15px}.tag{font-size:10px}}
.execution{counter-reset:step;list-style:none;padding:0;display:grid;gap:0;margin:20px 0}.execution li{position:relative;margin-left:15px;padding:0 0 22px 30px;border-left:2px solid #d4e0d6}.execution li:before{counter-increment:step;content:counter(step);position:absolute;left:-14px;top:0;width:26px;height:26px;display:grid;place-items:center;background:#e6efe8;border:1px solid #c6d8cb;border-radius:50%;font-size:12px;color:#47765a}.execution li:last-child{border-color:transparent;padding-bottom:0}.execution strong{font-size:15px}.execution p{font-size:13px;color:#728075;margin:5px 0 0}.walkstep{margin:18px 0;border:1px solid #dce5dd;border-radius:8px;background:white;overflow:hidden}.walktop{padding:16px 20px;background:#edf3ee;display:flex;gap:14px;align-items:center}.walktop span{color:#689175;font-size:13px}.walktop h3{margin:0;font-size:17px}.walkmeta{padding:12px 20px;border-bottom:1px solid #e6ebe7;font-size:13px;color:#4f6656}.walkbody{padding:4px 20px 12px}.walkrow{display:grid;grid-template-columns:100px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid #edf0ed;font-size:14px}.walkrow:last-child{border:0}.walkrow b{font-size:12px;color:#708578}.walkrow.block b{color:#9a763c}.walkrow p{margin:0}.startline{font-size:14px;color:#5f7365;margin:18px 0}.boundary{border:1px solid #e6dec8;background:#faf7ef;padding:12px 16px;color:#82704c;font-size:12px;margin:20px 0}.handoff{margin:24px 0;padding:18px 20px;background:#e9f0ea;border-left:3px solid #739a7e}.handoff strong{font-size:14px}.handoff p{font-size:14px}.handoff a{color:#326c4a;font-size:14px}.reference>summary{background:#f3f5f2}@media(max-width:700px){.walktop,.walkmeta{padding:12px 14px}.walkbody{padding:0 14px 8px}.walkrow{grid-template-columns:1fr;gap:4px;padding:10px 0}.walktop h3{font-size:16px}}
.node-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start;margin:18px 0}.node-layout .walkstep{margin:0}.dev-panel{border:1px solid #d6e2dc;border-radius:9px;background:#fff;padding:16px;font-size:13px;overflow-wrap:anywhere}.dev-panel h3{margin:0 0 12px}.dev-panel p{margin:8px 0}.dev-task{border-top:1px solid #e3e9e5;padding:10px 0}.dev-panel a{color:#287251}.dev-task small{display:block;color:#67786f;margin-top:6px}@media(max-width:1100px){.node-layout{grid-template-columns:1fr}.dev-panel{margin-top:0}} .node-layout{grid-template-columns:minmax(0,1fr) 240px}.dev-panel{padding:14px}.dev-panel h3{font-size:14px;margin-bottom:8px}.dev-muted{color:#64746c;font-size:12px;line-height:1.7}.dev-open,.dev-close{font:inherit;cursor:pointer;background:#eff5f1;color:#285e45;border:1px solid #cadbd0;border-radius:6px;padding:7px 12px}.dev-dialog{width:min(680px,calc(100vw - 32px));max-height:85vh;box-sizing:border-box;padding:0;border:1px solid #d6e2dc;border-radius:12px;color:#253b32;background:#fff;box-shadow:0 20px 80px #12271e33}.dev-dialog::backdrop{background:#152b2466}.dev-dialog-head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;padding:16px 22px;border-bottom:1px solid #e3e9e5;z-index:1}.dev-dialog-content{padding:18px 22px;overflow-wrap:anywhere;font-size:14px;line-height:1.7}.dev-full h3{margin-top:0}.dev-full a{color:#287251}body:has(.dev-dialog[open]){overflow:hidden}@media(max-width:1100px){.node-layout{grid-template-columns:1fr}.dev-panel{max-width:none}} </style></head><body><header><strong>梦擎 · 流程协作看板</strong><span>2026.10.17 · 讨论稿<br>方向已认可 ≠ 细节已确认</span></header><div class="app"><aside id="nav"></aside><main id="main"></main></div><dialog class="dev-dialog" id="dev-dialog" aria-labelledby="dev-dialog-title"><div class="dev-dialog-head"><strong id="dev-dialog-title">节点开发详情</strong><button class="dev-close" type="button" aria-label="关闭开发详情">关闭 ×</button></div><div class="dev-dialog-content"></div></dialog><template id="implementation-content"><div class="notice">建议定位：企业级的业务记录，描述一项持续工作。初期用于首批接入，后续仍可修订和扩展。工作说明提出需求，不直接授予权限或启动任务。</div>
<details class="stage"><summary><span class="num">A</span><span class="title"><strong>谁创建，谁维护</strong><small>职责沿现有身份体系执行；编辑与生效分开</small></span><span class="chev">›</span></summary><div class="body"><div class="tablewrap"><table><thead><tr><th>职责</th><th>建议操作</th><th>边界</th></tr></thead><tbody><tr><td>企业负责人／获授权管理员</td><td>创建说明、指定业务负责人及协作者，确认范围生效或暂停</td><td>管理身份不自动获得底层资料阅读权限</td></tr><tr><td>指定业务负责人</td><td>组织梳理，维护用途、预期结果及验收问题；在委托范围内确认版本</td><td>不能直接扩大成员权限或预算</td></tr><tr><td>实际使用者／协作者</td><td>提供案例、反馈；获编辑授权时修改草稿</td><td>普通反馈不自动改变生效版本</td></tr><tr><td>接入人员与 AI</td><td>在明确授权下整理材料、提出草稿与缺口</td><td>来源、推断和待核实项分别记录；不自动生效</td></tr></tbody></table></div><p class="subtle">角色是职责组合，可由同一人承担；授权方式和是否需要委派确认稍后再细化。</p></div></details>
<details class="stage"><summary><span class="num">B</span><span class="title"><strong>入口放在哪里</strong><small>企业管理端为主，其他入口按职责关联</small></span><span class="chev">›</span></summary><div class="body"><div class="wire"><nav><div>企业概览</div><div><b>业务与接入 ← 建议入口</b></div><div>数据基座</div><div>知识库</div><div>成员与权限</div></nav><div class="panel"><span class="tag draft">结构示意 · 非最终页面设计</span><strong style="margin-top:10px">首批工作说明</strong><p class="subtle">列表：工作名称 · 责任人 · 说明状态 · 准备进度</p><div class="pills"><span>用途与成果</span><span>人员与责任</span><span>来源与缺口</span><span>准备与验证</span><span>版本与变更</span></div><p>企业概览提供进度入口；客户端展示与本人有关的已启用工作及反馈入口；总台沿现有支持授权查看接入进度。</p></div></div><p class="subtle">导航名称暂定。优先在现有企业概览内增加接入入口，是否独立成为一级导航随信息量确定。</p></div></details>
<details class="stage"><summary><span class="num">C</span><span class="title"><strong>前端与后端分别调整什么</strong><small>复用现有基础能力，新增工作说明及其关联</small></span><span class="chev">›</span></summary><div class="body"><div class="tablewrap"><table><thead><tr><th>能力</th><th>前端调整建议</th><th>后端调整建议</th></tr></thead><tbody><tr><td>说明管理</td><td>列表、创建／编辑、详情、负责人选择</td><td>新增企业级工作说明对象、职责授权与版本</td></tr><tr><td>信息与缺口</td><td>六项基础信息；区分已核实、推断和待补充</td><td>保存依据关联、待解决项及处理状态</td></tr><tr><td>关联现有对象</td><td>选择已有空间、资料、来源、知识和指标</td><td>引用已有对象 ID 与适用版本；检查企业隔离和权限</td></tr><tr><td>生效与修订</td><td>草稿、差异查看、生效、暂停／归档</td><td>生效版本与新草稿并存；审计并记录影响</td></tr><tr><td>接入进度</td><td>展示缺什么、谁处理、哪些工作可用</td><td>从真实采集、治理和验证结果汇总，不由模型自述完成</td></tr><tr><td>运行交接</td><td>查看关联任务、计划、成果和反馈</td><td>任务引用说明版本；调度与授权仍走既有服务</td></tr></tbody></table></div><div class="notice">说明状态（草稿／生效／暂停／归档）与能力准备状态（未准备／部分可用／已验证）分开。范围生效不代表来源就绪，也不代表已启用自动工作。</div></div></details>
<details class="stage"><summary><span class="num">D</span><span class="title"><strong>哪些复用，哪些新增</strong><small>避免再建立一套成员、资料和任务系统</small></span><span class="chev">›</span></summary><div class="body"><table><tr><th>复用</th><th>新增或扩展</th></tr><tr><td>企业与成员身份、工作空间、现有访问控制、资料与来源目录、知识与指标版本、任务与审计基础</td><td>工作说明对象及权限动作、与既有对象的关联、缺口清单、准备状态汇总、验证案例关联、版本影响记录</td></tr></table><p class="subtle">复用指沿现有能力扩展，不代表不需要接口或权限适配。企业信息用于共用背景，空间说明用于空间约定；工作说明保存具体工作的用途与要求。</p></div></details></template><template id="handoff-content"><div class="tablewrap"><table><thead><tr><th>工作说明中的内容</th><th>后续用途</th><th>不自动发生的动作</th></tr></thead><tbody><tr><td>谁使用、谁负责</td><td>形成成员、职责和权限配置需求</td><td>不自动授权数据阅读或下载</td></tr><tr><td>需要什么依据</td><td>确定接入来源和待补缺口</td><td>不自动连接源系统或扩大取数范围</td></tr><tr><td>希望解决什么问题</td><td>组织相关业务知识、指标与验证案例</td><td>不自动把推断升级为正式规则</td></tr><tr><td>需要什么成果</td><td>提供任务目标、交付要求和工具需求</td><td>不自动共享私人结果</td></tr><tr><td>何时需要系统主动工作</td><td>形成计划配置及启用条件</td><td>不因说明生效而自动开启收费调用</td></tr><tr><td>说明发生变更</td><td>评估受影响来源、指标、计划与验证项</td><td>不静默改写历史任务和成果</td></tr></tbody></table></div><p>接入与运行引用同一份说明的明确版本；已有任务按原版本执行，变更影响和暂停边界后续专题确定。</p></template><template id="organization-content"><h2>系统实现流程</h2><p class="intro">方向已认可；以下执行划分、状态名称与权限细节仍待确认。既有开通能力复用，准备记录及责任关联拟扩展。</p><ol class="execution"><li><strong>总台：建立企业准备记录</strong><p>后端保存企业及准备状态，关联第一阶段用途草稿；不新建第二套企业身份。</p></li><li><strong>总台：邀请首位负责人</strong><p>复用邀请与接受流程，保存待接受状态；尚未接受时由获授权接入人员继续维护准备草稿。</p></li><li><strong>负责人：接受并激活</strong><p>后端校验邀请与身份、登记企业责任；账号激活与业务准备状态分别维护。</p></li><li><strong>企业端：指定接入负责人、加入首批成员</strong><p>复用成员管理；后端检查委派资格，保存责任关联及操作记录。</p></li><li><strong>工作说明：指定业务负责人及协作者</strong><p>将责任关联到具体工作，检查本企业有效成员及操作权限；责任不自动授予资料读取权。</p></li><li><strong>企业端：展示待办与交接情况</strong><p>根据实际缺口和责任关联展示处理入口。负责人变更检查未完成事项，保留交接记录。</p></li></ol><details class="stage"><summary><span class="title"><strong>责任分工与阶段完成标准</strong></span><span class="chev">›</span></summary><div class="body"><div class="tablewrap"><table><thead><tr><th>责任</th><th>负责内容</th><th>边界</th></tr></thead><tbody><tr><td>企业负责人</td><td>企业归属、整体范围、重要授权及责任委派</td><td>不自动核实所有业务口径</td></tr><tr><td>接入负责人</td><td>协调人员、来源、资料及待解决事项</td><td>不自动获得全部资料权限</td></tr><tr><td>业务负责人</td><td>某项工作的规则、成果标准、验证及维护</td><td>不自动成为企业管理员</td></tr></tbody></table></div><p>同一人可承担多种责任；先配置首批参与者，按协作需要建立或复用空间，不强制一项工作一个空间。</p><div class="notice">完成标准：企业有正式负责人，首批参与者可进入系统，每项首批工作有人负责，接入缺口有人推进。资料和授权配置在后续阶段继续完成。</div></div></details><details class="stage"><summary><span class="title"><strong>前后端调整</strong></span><span class="chev">›</span></summary><div class="body"><div class="tablewrap"><table><thead><tr><th>前端调整</th><th>后端调整</th></tr></thead><tbody><tr><td>总台展示准备状态、负责人激活情况及接入进度</td><td>区分身份状态与准备状态，复用企业记录</td></tr><tr><td>企业端选择接入负责人及首批参与者</td><td>新增责任关联，复用成员与委派权限基础</td></tr><tr><td>工作说明中选择业务负责人及协作者</td><td>保存工作级责任与相应操作授权</td></tr><tr><td>待办展示处理人，责任变更展示待交接事项</td><td>关联缺口、留存交接与审计记录</td></tr></tbody></table></div></div></details></template><template id="scope-content"><h2>系统实现流程 · 调整建议</h2><p class="intro">方向已认可，具体权限及实现细节待确认。本阶段形成信息范围与授权计划；实际连接、凭据安装和采集在第四阶段执行。</p><ol class="execution"><li><strong>工作说明：列出所需信息</strong><p>按代表性工作识别业务数据、资料、制度和指标依据；区分必需与补充。</p></li><li><strong>企业端：关联已有来源，登记待接来源</strong><p>已有对象仅在当前权限内展示；未知来源可登记需求，不暴露未授权目录或内容。</p></li><li><strong>接入人员：核实来源与边界</strong><p>明确来源责任人、可用接口或资料提供方式、必要字段和记录范围、覆盖期间与更新需要。</p></li><li><strong>企业端：配置拟使用范围与操作</strong><p>分别标明谁可查看、谁可让 AI 使用、谁可维护、能否下载和共享；沿现有权限能力落实。</p></li><li><strong>有授权资格者：核准范围</strong><p>后端校验授权资格，比较现有权限与所需范围，展示差异与缺口；负责人职责不替代授权资格。</p></li><li><strong>后端：保存版本并交给接入执行</strong><p>保存来源需求、工作关联、授权依据与范围版本；授权计划已确定不等于连接已完成或权限已实际生效。</p></li><li><strong>运行时：复核有效权限</strong><p>来源限制、企业／空间权限及相应对象权限共同约束读取和工具执行；跨来源成果按依赖约束交付。</p></li></ol><details class="stage"><summary><span class="title"><strong>需要规划的信息与使用范围</strong></span><span class="chev">›</span></summary><div class="body"><div class="tablewrap"><table><thead><tr><th>规划项</th><th>应明确的内容</th></tr></thead><tbody><tr><td>用途与必要性</td><td>服务哪项工作；必需还是补充；缺失会阻止什么</td></tr><tr><td>来源与责任</td><td>来自哪个系统／资料；谁提供、谁核实、谁有资格授权</td></tr><tr><td>信息范围</td><td>业务对象、必要字段、记录范围、历史期间、更新需求及敏感项</td></tr><tr><td>位置与复用</td><td>关联哪些空间、复用哪些已有来源；一份来源可支持多项工作</td></tr><tr><td>操作与受众</td><td>人工查看、AI 使用、维护、下载及共享分别按现有规则控制</td></tr><tr><td>缺口与限制</td><td>待提供、待授权、范围不足、能力不支持或已停用等原因</td></tr></tbody></table></div></div></details><details class="stage"><summary><span class="title"><strong>前后端调整</strong></span><span class="chev">›</span></summary><div class="body"><div class="tablewrap"><table><thead><tr><th>功能</th><th>前端调整</th><th>后端调整</th></tr></thead><tbody><tr><td>来源规划</td><td>工作说明内增加“信息与授权范围”列表，关联既有来源或登记需求</td><td>新增工作与来源需求关联，引用现有目录；未接来源只保留需求记录</td></tr><tr><td>授权差异</td><td>展示所需操作、已有能力、缺口及有资格处理的人</td><td>复用服务端权限检查，增加差异计算；过滤目录元信息</td></tr><tr><td>接入交接</td><td>展示“范围已明确／待配置／已生效／待验证”，分开显示</td><td>保存范围版本、授权依据和配置回执；凭据留在部署密钥机制</td></tr><tr><td>跨空间使用</td><td>复用来源，明确成果目标位置与受众</td><td>读取与共享分别检查，维护多来源依赖与撤权传播</td></tr><tr><td>变更影响</td><td>显示哪些工作受范围调整影响</td><td>新增变更影响关联；扩权重新走相应授权，失效限制进入执行检查</td></tr></tbody></table></div></div></details><details class="stage"><summary><span class="title"><strong>边界与完成标准</strong></span><span class="chev">›</span></summary><div class="body"><p>默认围绕首批用途接入必要信息。工作说明提出需求，授权由具备资格的人或既有规则决定；AI 可整理建议，不能自行扩权。只读分析不自动获得源系统写权限。</p><p>共享空间归属不是所有来源的统一授权替代；后台使用维护者采集数据，也不能将维护者权限转授给普通员工。</p><div class="notice">完成标准：首批工作需要哪些信息、从哪里取得、由谁提供、允许谁做什么，以及缺口由谁处理，都有明确记录。信息实际接通和有效权限验证属于下一阶段及后续验收。</div><p class="subtle">当前跨服务权限同步存在窗口；目标撤权传播方式需在实现细化时确定，不把立即生效表述为已有事实。</p></div></details></template><template id="foundation-content"><h2>系统实现流程 · 调整建议</h2><p class="intro">方向已认可，具体状态、发布资格与实现细节待确认。复用采集、解析、治理、指标和同步能力，调整交接与发布方式。</p><ol class="execution"><li><strong>接入人员：安装获准来源</strong><p>读取第三阶段范围版本，配置连接、只读身份、固定投影或上传资料。凭据由部署环境管理；复用已有来源，不能因接入自动扩权。</p></li><li><strong>后台：获取并保存原始依据</strong><p>采集器或上传服务生成来源版本、获取记录和覆盖说明。失败保留上个仍有效版本及其时效状态，不把部分取数包装成完整快照。</p></li><li><strong>处理服务：解析与质量检查</strong><p>按来源分流：文档形成正文及位置引用；结构化数据保留类型、单位、空值和业务记录。异常隔离或标注，保留原件和处理回执。</p></li><li><strong>接入人员与业务负责人：核实语义</strong><p>结合制度、源系统行为与样例核实对象、状态、关联、口径和例外。区分已核实事实、推断及待决定事项；AI 辅助整理。</p></li><li><strong>知识与指标服务：形成工作所需基础</strong><p>资料建立检索索引；跨来源整合业务专题；指标保存定义和可执行计划。内容说明与机器执行规则相互关联，不要求每表出文章。</p></li><li><strong>校验与发布：发布可用部分</strong><p>分别检查内容依据、计算计划、来源版本与权限；技术检查通过不冒充业务事实已核实。发布有依据的部分，其余保留明确缺口。</p></li><li><strong>同步服务：同步并验证实际消费</strong><p>沿主服务与 Wiki 既有桥接检查版本、权限、可检索性和计算回执。页面可见不等于任务可用，同步失败明确展示。</p></li><li><strong>工作说明：汇总准备状态</strong><p>关联实际处理、发布和同步结果，标明可支持哪些工作、仍缺什么、责任人是谁。进入第五阶段按真实角色验证完整工作；不自动启用主动任务。</p></li></ol><details class="stage"><summary><span class="title"><strong>当前链路与问题</strong></span><span class="chev">›</span></summary><div class="body"><div class="tablewrap"><table><tr><th>当前机制</th><th>问题判断</th></tr><tr><td>数据基座／Wiki 进行接入、治理、学习，再同步至主系统</td><td>不同服务与后台任务分别推进，缺少面向具体工作的完整准备结果</td></tr><tr><td>部署包要求每表附带知识；资料学习按单份来源出文</td><td>来源摘要占据业务知识位置，多来源流程、规则与例外容易分散</td></tr><tr><td>指标已支持自动定义与发布、固定计划及部分跨表聚合</td><td>记录数与原始值合计不等于经营指标；关联可算不等于业务含义成立</td></tr><tr><td>已有版本、质量检查、引用与权限约束</td><td>技术成功和业务可用没有统一交接；需要区分覆盖不足、口径未知与执行故障</td></tr></table></div></div></details><details class="stage"><summary><span class="title"><strong>业务基础分成哪些对象</strong></span><span class="chev">›</span></summary><div class="body"><div class="tablewrap"><table><tr><th>对象</th><th>用途</th><th>维护原则</th></tr><tr><td>原始依据</td><td>源数据、原件、制度、系统执行依据与版本</td><td>保留来源；解析结果不替代原件</td></tr><tr><td>数据说明与关系</td><td>对象粒度、字段、状态、单位、关联与可加性</td><td>部署核实；业务语义变化需重新检查，不由统计变化自动改写</td></tr><tr><td>业务知识</td><td>按工作主题整合流程、条件、职责和例外</td><td>多来源支持，标明事实、推断与未决项</td></tr><tr><td>指标及计算计划</td><td>将业务口径变成可执行的计算规则</td><td>技术统计与经营指标分开；文案口径与执行规则对应</td></tr><tr><td>检索与消费准备</td><td>让获权任务能找到有效依据并执行所需计划</td><td>验证主系统实际读取，不仅检查管理端展示</td></tr></table></div><div class="notice">经营观察是使用业务基础得到的阶段性成果，不是首次接入必须凑齐的知识文章。无需先生成专题文章，才能检索原始资料。</div></div></details><details class="stage"><summary><span class="title"><strong>谁处理，怎样分步放行</strong></span><span class="chev">›</span></summary><div class="body"><div class="tablewrap"><table><tr><th>职责</th><th>处理内容</th></tr><tr><td>接入人员</td><td>安装来源、核实技术事实、维护字段与连接配置</td></tr><tr><td>业务负责人</td><td>核实业务含义、处理规则冲突与经营口径决定</td></tr><tr><td>系统与 AI</td><td>执行解析、检查、候选整理、可支持的技术定义和验证；保留真实结果</td></tr><tr><td>有发布资格者或已授权自动规则</td><td>在授权范围内发布；具体发布资格后续细化，不取消既有授权的自动能力</td></tr></table></div><p>按工作需求分步准备：一般资料问答需要可检索的有效正文；流程解释需要可靠规则依据；经营统计需要有效数据及明确计算计划。一个未知字段不应阻止无关工作，但影响核心口径时不能靠猜测放行。</p></div></details><details class="stage"><summary><span class="title"><strong>前后端调整</strong></span><span class="chev">›</span></summary><div class="body"><div class="tablewrap"><table><tr><th>功能</th><th>前端调整</th><th>后端调整</th></tr><tr><td>工作级接入视图</td><td>来源列表关联工作，展示处理进度、问题及责任人</td><td>关联范围版本与来源；复用采集、解析任务及幂等机制</td></tr><tr><td>内容与数据处理</td><td>展示覆盖范围、解析状态、隔离项和失败原因</td><td>统一处理回执关联；保留原件、快照、来源版本和质量状态</td></tr><tr><td>业务知识整理</td><td>业务专题与字段说明、统计观察分开展示</td><td>支持多来源专题依赖与版本；调整逐表、逐文件发布要求</td></tr><tr><td>口径与计算</td><td>关联指标定义、适用条件、执行范围和验证结果</td><td>定义与计算计划一致校验；保留自动技术定义并明确语义层级</td></tr><tr><td>准备与发布</td><td>按所需能力展示已可用、受限和阻塞项</td><td>从真实回执推导工作准备状态；分别检查权限、版本、同步及依赖</td></tr><tr><td>交接与维护</td><td>展示可进入验证的工作及剩余缺口</td><td>向第五阶段提供固定依据和验证入口；登记后续变化影响</td></tr></table></div></div></details><details class="stage"><summary><span class="title"><strong>完成标准与异常处理</strong></span><span class="chev">›</span></summary><div class="body"><p>本阶段完成意味着：首批工作的必要来源已进入系统，原始依据可追溯，所需规则和指标有明确适用范围，获权任务能检索或计算；不足项有原因和责任人。</p><p>来源失败、解析不完整、口径未明确、计划不支持和同步失败分别呈现。是否继续使用旧版取决于来源仍有效、时效适合及权限允许，不能一律沿用，也不能每次刷新撤掉全部历史成果。</p><div class="notice">第四阶段检查业务基础是否准备好；第五阶段验证实际员工能否完成完整工作。这里不把技术检查成功当成人工业务验收。</div></div></details></template><template id="validation-content"><h2>系统实现流程 · 调整建议</h2><p class="intro">方向已认可，具体案例、状态与验收资格待确认。复用真实会话、任务和成果链路，增加工作级验证记录；不将部署检查或模型自述视为业务验收。</p><ol class="execution"><li><strong>工作说明：整理代表性验证案例</strong><p>从首批目标及实际工作中选择正常、例外、信息不足和权限边界案例。记录预期成果、判断依据和责任人，不由同一模型自答自判。</p></li><li><strong>企业端：确定本轮验证范围</strong><p>关联工作说明、来源、知识及指标版本，指定参与者；检查必要准备条件。缺失项明确阻塞受影响案例，不伪装成测试失败或通过。</p></li><li><strong>参与者：用本人账号发起实际工作</strong><p>通过正常会话或技能入口执行，关联本轮验证案例；权限仍取实际发起人，不能借用管理员资格。收费调用或外部动作沿实际授权与启用边界。</p></li><li><strong>后端：记录真实执行证据</strong><p>复用任务、工具回执、引用、计算结果及成果版本，保存实际输入和执行上下文关联；不复制一套测试引擎，不自动开启日常计划。</p></li><li><strong>系统与评估人员：分别核对结果</strong><p>系统检查可确定的权限、来源有效性、计算与文件完整性；业务负责人及使用者核对业务含义、例外和实用性。任务成功与验证通过分开。</p></li><li><strong>工作说明：按案例记录结论</strong><p>记录通过、需修正、阻塞或未执行及理由和证据；权限泄露、关键计算或业务口径错误阻止相应范围通过，不用平均分掩盖。</p></li><li><strong>接入负责人：分流问题并安排复验</strong><p>来源问题回第四阶段、授权问题回第三阶段、用途偏差回第一阶段、执行故障进入能力维护。修正产生新一轮证据，保留原结果，只复验受影响范围。</p></li><li><strong>业务负责人：确认可用范围并交接</strong><p>按获委派资格确认哪些工作及角色已验证、哪些受限和哪些未通过；保存结论版本。进入第六阶段，由既有资格另行启用计划和运行配置。</p></li></ol><details class="stage"><summary><span class="title"><strong>当前做法与问题</strong></span><span class="chev">›</span></summary><div class="body"><div class="tablewrap"><table><tr><th>当前已有能力</th><th>仍需补齐</th></tr><tr><td>模块测试、部署检查及真实运行回执</td><td>目前未见以首批工作为单位贯穿目标、案例、实际角色、证据及结论的统一对象</td></tr><tr><td>真实模型、浏览器和用户验收在交接记录中分别说明</td><td>验证结果主要依赖项目交接，不易直接转成企业内的可用范围与待办</td></tr><tr><td>来源版本、任务记录、工具回执和产物可追溯</td><td>有执行证据不等于业务判断正确，还需要合适的预期依据和评估人</td></tr><tr><td>权限与固定指标执行约束</td><td>不能以管理员测试替代实际员工；技术成功不能替代业务可用</td></tr></table></div></div></details><details class="stage"><summary><span class="title"><strong>验证什么、谁判断</strong></span><span class="chev">›</span></summary><div class="body"><div class="tablewrap"><table><tr><th>维度</th><th>核对内容</th><th>主要判断者</th></tr><tr><td>身份与范围</td><td>本人能读应读内容，不能读未获授权内容；输出受众正确</td><td>服务端检查＋实际角色验证</td></tr><tr><td>依据与业务含义</td><td>引用支持结论，状态、范围、时间和例外解释正确</td><td>业务负责人，结合可靠来源</td></tr><tr><td>计算与产物</td><td>口径与实际计算一致，文件可打开且内容完整</td><td>确定性检查＋业务核对</td></tr><tr><td>可用性</td><td>使用者能独立完成工作并理解结果，追问或修改路径清楚</td><td>实际使用者</td></tr><tr><td>失败与恢复</td><td>缺信息说明、失败原因、补充和重试真实有效</td><td>使用者＋接入／技术人员</td></tr></table></div><p>预期结果不必都是一段标准答案，也可以是核对数字、必要依据、产物要求和不可越过的边界。AI 可辅助整理，但不独立决定业务验收通过。</p></div></details><details class="stage"><summary><span class="title"><strong>案例范围与结论</strong></span><span class="chev">›</span></summary><div class="body"><p>每项工作选择少量代表性案例：正常路径、关键例外、资料不足与权限边界。根据实际风险补充，不机械为每项工作套同一数量。</p><div class="tablewrap"><table><tr><th>记录层次</th><th>建议状态／内容</th></tr><tr><td>案例执行</td><td>未执行／执行中／完成／执行失败；沿真实任务状态</td></tr><tr><td>案例判断</td><td>通过／需修正／阻塞／待判断；附证据与原因</td></tr><tr><td>工作可用范围</td><td>角色、任务类型、信息范围、已验证能力及限制</td></tr><tr><td>后续变化</td><td>来源、规则或权限变化时按影响标记需复验；旧结论保留历史含义</td></tr></table></div><div class="notice">部分可用必须列出具体可用范围和未通过项，不能用模糊的“基本通过”。数据正常更新不自动要求整套重测，关键口径、权限或能力变化按影响复验。</div></div></details><details class="stage"><summary><span class="title"><strong>前后端调整</strong></span><span class="chev">›</span></summary><div class="body"><div class="tablewrap"><table><tr><th>功能</th><th>前端调整</th><th>后端调整</th></tr><tr><td>案例准备</td><td>工作说明的“准备与验证”区域展示案例、角色、预期成果和依据</td><td>新增工作级案例与验证批次，关联说明和基础版本</td></tr><tr><td>实际执行</td><td>跳转正常会话／技能入口，显示待执行与执行结果</td><td>通过案例关联真实任务；保持真实身份、权限和现有计量</td></tr><tr><td>证据与判断</td><td>查看引用、计算、产物，分别记录系统检查及业务结论</td><td>复用回执和产物，新增结论、评估资格检查及审计；不因验证扩大证据可见范围</td></tr><tr><td>问题复验</td><td>待修正项显示责任人、归属阶段及复验记录</td><td>关联缺口与后续任务，版本化保留原失败与新结果</td></tr><tr><td>交接运行</td><td>展示已验证范围、限制及待处理事项</td><td>保存工作级可用结论，供第六阶段检查；不自动开启计划</td></tr></table></div></div></details><details class="stage"><summary><span class="title"><strong>完成标准与阶段边界</strong></span><span class="chev">›</span></summary><div class="body"><p>完成标准：指定角色对首批约定工作已有可追溯的验证结果；关键问题处理完成或对应范围明确不启用；可用范围与限制由具备资格的业务负责人记录确认。</p><p>本阶段允许在授权范围内执行必要验证任务；持续采集、计划与主动工作的日常启用在第六阶段单独确定。验收资格不自动包含阅读所有私人会话和敏感证据的权限。</p></div></details></template><template id="activation-content"><h2>系统实现流程 · 调整建议</h2><p class="intro">方向已认可，具体配置、状态及启用资格待确认。以工作级运行安排连接验证结论与现有服务，复用调度和执行能力，不新增平行任务引擎。</p><ol class="execution"><li><strong>工作说明：读取可用范围</strong><p>引用第五阶段验证结论及其版本，列明角色、工作类型、依据和限制；未通过范围不进入启用。已有有效配置需先盘点，不自动关闭或重建。</p></li><li><strong>企业端：确定日常运行安排</strong><p>分别选择员工按需使用、基础持续更新、系统主动工作；明确参与范围、更新或触发方式、成果位置、维护及异常责任。</p></li><li><strong>后端：检查启用条件与配置差异</strong><p>检查操作者资格、当前来源与权限、验证结论适用性、工具和模型可用性及资源约束；展示阻塞项、现有配置与拟变更，不能把历史验证视为永久授权。</p></li><li><strong>有资格者：提交启用</strong><p>后端保存运行安排版本，将相应配置写入或关联既有采集、调度、任务服务；幂等处理并记录回执。部分配置失败明确展示，不把局部成功标为全量启用。</p></li><li><strong>客户端与后台：按实际配置运行</strong><p>客户端展示本人可使用的工作入口；后台按已启用规则更新来源或创建任务，执行与交付继续检查当时有效权限和来源版本。</p></li><li><strong>运行视图：观察交接后的实际结果</strong><p>关联最近同步、任务、交付、失败和待处理事项；首次日常执行未完成时标明尚未观察，不为证明成功额外发起未经授权调用。</p></li><li><strong>维护人员：处理异常与变化</strong><p>技术故障沿既有恢复机制处理；业务或来源变化回基础维护，关键口径和权限变化触发受影响范围复验。避免无限重试；失效依赖停止使用。</p></li><li><strong>企业端：调整、暂停或恢复</strong><p>按工作范围控制主动任务；共享来源更新与其他工作分别处理。说明在途任务处置、历史成果有效性及恢复条件，保留版本与操作记录。</p></li></ol><details class="stage"><summary><span class="title"><strong>当前做法与问题</strong></span><span class="chev">›</span></summary><div class="body"><div class="tablewrap"><table><tr><th>当前已有机制</th><th>需要调整的衔接</th></tr><tr><td>采集、解析、知识学习、治理同步、指标生成与画报等分别运行</td><td>模块启用状态分散，难以直接回答某项工作究竟启用了哪些能力</td></tr><tr><td>已有开关、调度、额度、并发及任务记录</td><td>验证结论与实际启用配置缺少工作级关联；服务正常不等于工作已持续交付</td></tr><tr><td>部分企业已经明确授权自动定义和主动任务</td><td>需要盘点并关联现有有效配置，不能把流程梳理当作重新授权全部业务</td></tr><tr><td>已有失败、重试、撤权和来源失效检查</td><td>异常归属、暂停范围、变更影响和恢复条件需要在工作层清楚表达</td></tr></table></div></div></details><details class="stage"><summary><span class="title"><strong>日常运行分成三类</strong></span><span class="chev">›</span></summary><div class="body"><div class="tablewrap"><table><tr><th>运行类型</th><th>启用时明确</th><th>边界</th></tr><tr><td>员工按需使用</td><td>哪些角色可执行哪些工作、所需能力与成果要求</td><td>用户请求走正常任务链；不因入口可见而扩大权限</td></tr><tr><td>基础持续更新</td><td>数据采集、资料同步、解析及必要治理维护的范围和方式</td><td>沿来源服务调度；多项工作共享时不重复建立采集任务</td></tr><tr><td>系统主动工作</td><td>为谁做、何时触发、价值判断、去重、资源约束和交付位置</td><td>明确已有授权与启用范围；更新数据不自动等于每次生成画报</td></tr></table></div><div class="notice">三类运行分别控制。员工可以先按需使用，主动工作随后启用；已授权且正常运行的能力继续按既有配置执行，不要求重新逐项审批。</div></div></details><details class="stage"><summary><span class="title"><strong>职责、状态与完成标准</strong></span><span class="chev">›</span></summary><div class="body"><div class="tablewrap"><table><tr><th>内容</th><th>建议</th></tr><tr><td>业务负责人</td><td>维护工作目标、成果质量及业务限制，决定业务调整需求</td></tr><tr><td>来源维护责任</td><td>处理来源、资料、规则和口径变化；保持与工作依赖关联</td></tr><tr><td>运行支持责任</td><td>处理连接、工具、模型、调度及执行故障，必要时分流</td></tr><tr><td>配置状态</td><td>区分未启用、部分启用、已启用、已暂停；以实际配置回执为依据</td></tr><tr><td>运行观察</td><td>分别呈现暂无执行、正常、受限、异常及最近证据；不由一个开关推断健康</td></tr></table></div><p>阶段完成：启用范围和实际配置一致，参与者有可用入口，持续更新与主动任务按约定安排，异常有人处理。若尚未到首轮执行时间，保留“已配置、待首轮观察”，不宣称已稳定运行。</p></div></details><details class="stage"><summary><span class="title"><strong>前后端调整</strong></span><span class="chev">›</span></summary><div class="body"><div class="tablewrap"><table><tr><th>功能</th><th>前端调整</th><th>后端调整</th></tr><tr><td>运行安排</td><td>工作说明增加“日常运行”，显示验证范围和三类运行选择</td><td>新增运行安排版本及与验证结论、既有来源和计划的关联</td></tr><tr><td>启用检查</td><td>展示现有配置、拟变更、资源边界和阻塞项</td><td>复用权限与能力检查，关联既有开关／计划，幂等执行并记录部分失败</td></tr><tr><td>运行入口</td><td>客户端展示本人可使用工作及交付位置</td><td>沿实际权限提供工作上下文与有效版本；不复制独立执行链</td></tr><tr><td>状态与异常</td><td>聚合最近更新、任务、成果、失败和处理责任</td><td>复用运行回执，形成工作级汇总与问题分流；检查共享依赖</td></tr><tr><td>变更与暂停</td><td>展示影响范围、在途任务和恢复条件</td><td>版本化配置；明确停止新任务与处理在途任务的不同动作，失效围栏保持生效</td></tr></table></div></div></details><details class="stage"><summary><span class="title"><strong>暂停、变更与下一条流程</strong></span><span class="chev">›</span></summary><div class="body"><p>暂停某项主动工作，不自动停止被其他工作共用的采集，也不删除历史成果。是否取消在途任务应作为清晰动作；权限撤销或来源失效时仍必须阻止受影响读取和交付。</p><p>运行安排修订后保留历史版本。普通数据更新按既定规则推进；关键业务口径、权限或能力变化按影响回到前面相应阶段，必要时复验后恢复。</p><div class="notice">首次接入在这里交给日常工作闭环、业务基础维护、运行与能力维护。当前只确定交接框架，具体频率、重试次数、费用参数和外部通知方式后续细化。</div></div></details></template><script>
const stages=[{"id": "purpose", "n": "01", "title": "了解企业业务与接入需求", "sub": "方向已认可 · 负责人访谈与经办人演示", "status": "方向已认可", "current": "用途信息分散在企业背景、工作空间、来源解释、内容规则与会话中。当前未见贯穿接入的统一工作说明对象。", "problem": "接入目标容易与技术配置脱节；无法清楚追踪一项工作的依据、缺口与可用标准。", "target": "先访谈负责人了解企业业务与接入诉求，再看经办人实际操作，整理企业情况、首批目标、系统资料、对接人和待核实问题。", "detail": "六项基础信息：优先问题、使用人员、当前做法、信息依据、预期成果、可用标准与边界。", "output": "本阶段输出：首批工作说明草稿及缺口清单。具体功能落地见下一节。"}, {"id": "organization", "n": "02", "title": "开通企业与配置使用人员", "sub": "方向已认可 · 实现细节待确认", "status": "方向已认可", "current": "总台发起企业开通，指定首位负责人；接受后激活，后续配置成员及职责。", "problem": "企业激活只说明账号和组织可用，不能表示业务已准备好。", "target": "建立接入负责人、业务维护责任和参与者，关联首批工作说明；允许与用途梳理并行。", "detail": "待讨论：企业开通、邀请、责任交接与工作说明创建的先后关系。", "output": "本阶段输出：企业身份、接入责任、各项工作责任及待办归属；不等同于业务已可用。"}, {"id": "scope", "n": "03", "title": "确认接入内容与授权范围", "sub": "方向已认可 · 实现细节待确认", "status": "方向已认可", "current": "来源取数范围由部署配置；空间及对象权限在系统中维护。治理同步已带入源端授权，使用时结合目标权限校验。后台采集资格不等于员工读取资格。", "problem": "缺少从工作需求到来源范围与具体操作权限的统一映射；已接入、已授权、可供 AI 使用容易混淆。跨服务授权变更仍有同步窗口。", "target": "为每项工作形成来源与授权范围计划，明确必要信息、责任、受众和操作；复用现有权限，分开记录计划核准与实际配置状态。", "detail": "待讨论：工作跨空间时如何关联来源，管理权限与阅读权限如何区分。", "output": "建议输出：版本化的信息来源与授权范围计划、缺口及处理责任。下一阶段执行实际接入。"}, {"id": "foundation", "n": "04", "title": "接入数据与配置业务基础", "sub": "方向已认可 · 实现细节待确认", "status": "方向已认可", "current": "部署侧配置连接与投影，企业端查看来源和更新；企业信息页已有背景维护。资料、字段治理、知识、指标和任务分别运行，尚缺统一的首批工作部署与绑定流程。", "problem": "逐表知识和逐文件文章容易碎片化；基础统计不等于经营指标；各环节成功含义不同。", "target": "按部署人员操作顺序完成数据接入、企业背景与规则配置、执行能力检查和试跑。普通会话沿现有按需读取机制使用数据，不以新增统一绑定对象为前提。", "detail": "待讨论：来源接入、治理、知识与指标的职责边界，以及发布条件。", "output": "建议输出：首批工作所需的可用来源、业务依据、指标与计划，以及未解决事项。随后进入真实角色工作验证。"}, {"id": "validation", "n": "05", "title": "用实际工作验证接入结果", "sub": "方向已认可 · 实现细节待确认", "status": "方向已认可", "current": "各功能已有测试、部署和运行回执，业务可用性还需要按实际角色验证。", "problem": "模块通过不能证明代表性工作全链可用；管理员可见也不代表普通员工可用。", "target": "用实际角色和代表性问题检查权限、依据、计算及成果质量，明确可用范围与限制。", "detail": "待讨论：验收问题来源、验证责任人、部分可用与失败处理。", "output": "建议输出：逐案例证据与判断、角色及工作可用范围、未通过项和责任人；供第六阶段决定实际启用。"}, {"id": "activation", "n": "06", "title": "交付使用与安排持续维护", "sub": "方向已认可 · 实现细节待确认", "status": "方向已认可", "current": "采集、学习、指标和画报等有各自开关、调度及运行状态。", "problem": "后台任务启用与业务准备程度缺少统一交接，可能先执行再等待条件。", "target": "按已验证范围启用相应持续更新和主动工作，明确责任、限制及后续维护。", "detail": "待讨论：启用条件、主动工作范围、异常反馈及版本变更。", "output": "建议输出：与实际配置一致的运行安排、可用入口、维护责任及首轮观察状态；接续日常工作与维护流程。"}];
const walkthroughs={"purpose": {"start": "部署人员先访谈企业／业务负责人，了解企业做什么、哪些人参与、目前遇到什么问题；再请实际经办人演示日常工作。此时以了解和记录为主，不要求企业账号已开通，也不开始配置连接。", "done": "形成一份接入访谈记录：企业基本情况、主要业务与分工、首批使用目标、现有工作做法、相关系统与资料、负责人及实际对接人、待核实问题和验证样例。后续阶段再落实企业开通、授权、背景录入和数据连接；访谈记录本身不授予权限，也不代表功能已可用。", "steps": [{"title": "访谈负责人，了解企业业务和接入诉求", "actor": "部署人员组织；企业负责人或相关业务负责人介绍", "page": "接入前访谈，可当面或在线交流，用普通文档记录", "action": "请负责人介绍主营业务、主要业务流程、部门分工，以及为什么希望使用梦擎。问清最想改善哪些工作、谁实际使用、谁能解释业务，再选出需要进一步了解的具体场景。", "system": "本阶段不进行系统配置。收集到的企业背景先作为访谈记录，后续核实后再录入现有企业信息或整理为业务资料。", "result": "留下企业基本情况、主要业务流程、相关负责人和首批使用诉求；区分对方明确说明的内容与仍需查证的问题。", "blocked": "负责人不了解具体操作时，约实际经办人继续演示；涉及其他部门时，由企业指定相应对接人补充。", "nodeId": "ONB-01-01"}, {"title": "请企业拿一件最近做过的工作，现场做给部署人员看", "actor": "部署人员提问；实际做这件事的员工演示，业务负责人补充", "page": "接入前会议／屏幕演示，在企业原来的业务系统或表格中；不是梦擎里的新页面", "action": "不要只问“你想用 AI 做什么”。请财务举例演示：昨天怎样查收款？打开哪个系统？导出哪张表？怎样找退款？最后把什么结果交给谁？只查看企业允许展示的内容。", "system": "这时梦擎还没有执行任何工作，也没有接入数据。部署人员观察原有操作并做沟通记录。", "result": "例如得到一条实际操作记录：“财务每天打开收款表和退款表，按日期筛选，再人工汇总，给负责人一份日报。”这比“建立一项工作”明确。", "blocked": "负责人讲不清具体操作，就请实际经办人演示；不能展示真实内容时，提供脱敏样例或空白模板。", "nodeId": "ONB-01-02"}, {"title": "选出这次先让梦擎帮忙的那一步", "actor": "业务负责人和实际使用者决定；部署人员核对现有能力", "page": "仍在接入沟通中，用普通会议记录或文档写清楚", "action": "沿刚才演示选一个目标，例如“先帮财务查询指定日期的收款和退款汇总，并给出来源依据”。说清希望在哪使用、需要回答还是表格；逐笔差异核对是否支持，要另外核查。", "system": "此时只是确定接入目标，不会因为记录了目标就生成技能、安装工具或启动任务。现有会话和计算工具能否完成，留到数据及口径核查后判断。", "result": "得到一句能拿来试用的话，例如：“请列出指定日期的收款、退款汇总，并说明采用的时间字段和状态范围。”具体业务口径由企业确认。", "blocked": "目标太大时由业务负责人选优先部分；部署人员不能直接承诺现有系统能做完整对账或自动处理退款。", "nodeId": "ONB-01-03"}, {"title": "记下完成这一步要用什么、找谁拿", "actor": "部署人员记录；企业业务人员指出来源和对接人", "page": "企业当前系统／表格／制度文档；接入沟通记录", "action": "逐项记下收款和退款在哪个系统、谁管理、是否有现行统计说明、谁能解释“完成退款”等状态。此时先记来源名称和对接人，不索取密码，不开始导入。", "system": "梦擎暂不读取这些来源。第三阶段确认允许范围，第四阶段再由部署工具配置连接、字段解释和相关资料。", "result": "得到具体准备项，例如“收款明细：业务系统，技术联系人甲；退款状态含义：财务乙；现有日报样例：财务提供脱敏版本”。", "blocked": "来源位置不明由企业技术对接人调查；口径没人能解释由业务负责人指定经办人，不让 AI 猜。", "nodeId": "ONB-01-04"}, {"title": "约定拿什么结果来判断这次接入有用", "actor": "实际使用者提供参考；业务负责人确认；部署人员记录", "page": "现有报表或获准样例，加一份简短沟 function devDetails(id){const d=development[id];if(!d)return '';const done=d.tasks.filter(t=>t.status==='已完成').length;const skipped=d.tasks.filter(t=>t.status==='不需开发').length;return `<div class="dev-full"><h3>节点开发 · ${safe(id)}</h3><p>负责人：${safe(d.owner)}</p><p>更新人：${safe(d.updatedBy)}<br>时间：${safe(d.updatedAt)}</p><p>已完成 ${done} / ${d.tasks.length} 项 · 不需开发 ${skipped} 项</p><p>实现：${safe(d.implementation)}<br>验证：${safe(d.validation)}<br>部署：${safe(d.deployment)}</p>${d.flowRevision!==1?'<p>流程已修订，请复核任务范围</p>':''}${d.blockers.length?'<p>阻塞：'+d.blockers.map(safe).join('；')+'</p>':''}${d.tasks.map(t=>`<div class="dev-task"><b>${safe(t.area)} · ${safe(t.status)}</b><p>${safe(t.title)}</p><small>${safe(t.id)} · ${safe(t.owner)}</small><small>依赖：${safe(t.dependsOn.join('、')||'无已登记依赖')}</small><details><summary>验收与证据</summary><p>${safe(t.acceptance)}</p><p>${safe(t.evidence.join('；')||'尚无验证证据')}</p></details></div>`).join('')}<a href="handoffs/${encodeURIComponent(id)}.md" target="_blank" rel="noopener">查看 handoff 文档 ↗</a></div>`;}
function devPanel(id){const d=development[id];if(!d)return '';const done=d.tasks.filter(t=>t.status==='已完成').length;return `<aside class="dev-panel"><h3>节点开发简介</h3><p>${safe(d.implementation)} · 完成 ${done}/${d.tasks.length} 项</p><p class="dev-muted">负责人：${safe(d.owner)}<br>更新：${safe(d.updatedBy)}<br><time datetime="${safe(d.updatedAt)}">${safe(d.updatedAt.replace('T',' ').slice(0,16))}</time></p>${d.blockers.length?'<p>有 '+d.blockers.length+' 项阻塞</p>':''}${d.flowRevision!==1?'<p>流程已修订，待复核</p>':''}<button class="dev-open" data-node="${safe(id)}">查看开发详情 ↗</button></aside>`;}
const nav=document.querySelector('#nav'),main=document.querySelector('#main');
nav.innerHTML='<a href="#overview">整体框架</a><div class="group">企业首次接入</div><a href="#onboarding">接入流程总览</a>'+stages.map(s=>`<a class="step" href="#${s.id}"><b>${s.n}</b>${s.title}</a>`).join('')+'<div class="group">后续流程</div>'+extra.map(e=>`<a href="#${e[0]}">${e[1]}</a>`).join('');

function render(){let id=location.hash.slice(1)||'overview';if(id==='implementation'||id==='handoff')id='purpose';if(id==='decisions')id='overview';let s=stages.find(s=>s.id===id);let content='';

else if(s){const w=walkthroughs[s.id];const next=stages[stages.indexOf(s)+1];

if(s.id==='purpose') content+='<div class="output">本阶段是业务了解与访谈：负责人讲业务与诉求，经办人演示实际工作，部署人员整理记录。明确首批用途是其中一项结果；企业背景录入、数据连接和权限配置在后续阶段落实。</div>';
content+=w.steps.map((x,i)=>`<div class="node-layout"><article class="walkstep"><div class="walktop"><span>${s.n}.${i+1}</span><h3>${x.title}</h3></div><div class="walkmeta"><strong>谁：</strong>${x.actor}<br><strong>在哪里：</strong>${x.page}</div><div class="walkbody"><div class="walkrow"><b>做什么</b><p>${x.action}</p></div><div class="walkrow"><b>系统处理</b><p>${x.system}</p></div><div class="walkrow"><b>看到的结果</b><p>${x.result}</p></div><div class="walkrow block"><b>缺条件谁接续</b><p>${x.blocked}</p></div>${x.existing?`<div class="walkrow"><b>已有可复用</b><p>${x.existing}</p></div><div class="walkrow"><b>需新增／调整</b><p>${x.change}</p></div>`:""}</div></article>${devPanel(x.nodeId)}</div>`).join('');
content+=`<div class="handoff"><strong>这一阶段完成后</strong><p>${w.done}</p>${next?`<a href="#${next.id}">接着看：${next.n} ${next.title} →</a>`:'<span class="subtle">首次接入的六阶段到此结束。日常工作闭环暂不展开。</span>'}</div>`;
content+=`<details class="stage reference"><summary><span class="title"><strong>现状与历史方案（含尚未采纳的新增功能建议）</strong><small>历史讨论保留供追溯；与上方操作走读有差异时以上方最新方案为准</small></span><span class="chev">›</span></summary><div class="body"><div class="columns"><article class="column"><h3>当前做法</h3><p>${s.current}</p></article><article class="column"><h3>有什么问题</h3><p>${s.problem}</p></article><article class="column target"><h3>调整方向</h3><p>${s.target}</p></article></div>`;
if(s.id==='purpose'){content+='<h2>首批工作说明 · 原功能方案</h2>'+document.querySelector('#implementation-content').innerHTML+'<details class="stage"><summary><span class="title"><strong>对后续接入与运行的影响</strong></span><span class="chev">›</span></summary><div class="body">'+document.querySelector('#handoff-content').innerHTML+'</div></details>'}
else content+=document.querySelector('#'+s.id+'-content').innerHTML;
content+='</div></details>';
}else{const e=extra.find(e=>e[0]===id);if(e)content=heading('后续流程',e[1],'待展开')+`<div class="output">${e[2]}</div><p class="intro" style="margin-top:20px">整体方向已认可。具体操作、角色及前后端调整，待企业接入流程梳理后继续讨论。</p>`;else{location.hash='overview';return}}
main.innerHTML=content+'<div class="footer">Git 协作看板 · 流程修订 1 · 开发状态由节点 handoff 生成，不是实时监控。<a href="README.md" target="_blank">维护说明</a> · <a href="CHANGELOG.md" target="_blank">流程变更记录</a>。Sites 已停止同步。</div>';document.querySelectorAll('#nav a').forEach(a=>{const active=a.hash==='#'+id;a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});window.scrollTo(0,0);}
const devDialog=document.querySelector('#dev-dialog');
main.addEventListener('click',event=>{const button=event.target.closest('[data-node]');if(!button)return;devDialog.querySelector('.dev-dialog-content').innerHTML=devDetails(button.dataset.node);devDialog.showModal();devDialog.scrollTop=0;});
devDialog.querySelector('.dev-close').addEventListener('click',()=>devDialog.close());
