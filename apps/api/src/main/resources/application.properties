spring.application.name=dreamcore-workspace-api
server.address=${API_HOST:127.0.0.1}
server.port=${API_PORT:18181}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
dreamcore.engine.base-url=${ENGINE_BASE_URL:http://127.0.0.1:18182}
dreamcore.engine.timeout-ms=${ENGINE_TIMEOUT_MS:1500}

# Explicit database configuration: never select another project's local database implicitly.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.flyway.clean-disabled=true
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
server.servlet.session.cookie.name=DREAMCORE_SESSION
dreamcore.platform.cookie-name=${PLATFORM_COOKIE_NAME:DREAMCORE_PLATFORM}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=none
spring.mvc.log-request-details=false
dreamcore.invitation.delivery=${INVITATION_DELIVERY:disabled}
dreamcore.invitation.outbox=${INVITATION_OUTBOX:./.local/invitations}
dreamcore.invitation.ttl-hours=72
spring.jackson.deserialization.fail-on-unknown-properties=true

# Originals are private and unparsed; no default shared storage location.
dreamcore.material.storage-root=${MATERIAL_STORAGE_ROOT:}
dreamcore.material.max-bytes=${MATERIAL_MAX_BYTES:20971520}
spring.servlet.multipart.max-file-size=${MATERIAL_MAX_BYTES:20971520}B
spring.servlet.multipart.max-request-size=65MB
spring.servlet.multipart.resolve-lazily=true

# Opt-in local parsing; no cloud or WeKnora calls.
dreamcore.knowledge.enabled=${KNOWLEDGE_ENABLED:false}
dreamcore.knowledge.parser-root=${KNOWLEDGE_PARSER_ROOT:}

# Explicit opt-in; no model credentials and no default cross-project runtime.
dreamcore.tasks.enabled=${TASK_ENABLED:false}
dreamcore.company-analysis.enabled=${COMPANY_INFORMATION_ENABLED:${TASK_ENABLED:false}}
dreamcore.tasks.engine-token=${TASK_ENGINE_TOKEN:}

# Parsing may block its worker; keep conversation dispatch independent.
spring.task.scheduling.pool.size=2

# off by default; verification only for isolated synthetic integration tests.
dreamcore.tasks.agent-mode=${AGENT_TASK_MODE:off}

dreamcore.tasks.public-web-enabled=${AGENT_PUBLIC_WEB_ENABLED:false}

dreamcore.tasks.candidate-trials-enabled=${AGENT_CANDIDATE_TRIALS_ENABLED:false}

# Transitional rollback only; legacy 0.9.0 was verified against Agent 1.4.
dreamcore.engine.legacy-090-enabled=${ENGINE_LEGACY_090_ENABLED:false}

# Phone identity is fail-closed until an explicit delivery mode is configured.
dreamcore.phone.delivery=${PHONE_DELIVERY:disabled}
dreamcore.phone.outbox=${PHONE_OUTBOX:./.local/phone-outbox}
dreamcore.phone.local-preview=${PHONE_LOCAL_PREVIEW:false}

# Source discovery only; no model calls or experience admission. Off until B4 integration.
dreamcore.experience-intake.enabled=${EXPERIENCE_INTAKE_ENABLED:false}

# Off until automatic admission and management observation are integrated.
dreamcore.experience-analysis.enabled=${EXPERIENCE_ANALYSIS_ENABLED:false}

# General-library contribution dispatch stays off until its end-to-end acceptance.
dreamcore.experience-generalization.enabled=${EXPERIENCE_GENERALIZATION_ENABLED:false}

# Read-only deployment observations; blank means explicitly not connected. No backup paths are served.
dreamcore.backup.status-file=${BACKUP_STATUS_FILE:}
dreamcore.backup.status-stale-seconds=${BACKUP_STATUS_STALE_SECONDS:900}
# Calendar window and daily grouping are explicit in usage responses; this does not set a billing cycle.
dreamcore.operations.time-zone=${OPERATIONS_TIME_ZONE:Asia/Shanghai}
