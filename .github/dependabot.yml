# Dependabot: npm (root) + Maven (apps/api)
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: chore(deps)
    ignore:
      # 版本更新忽略 semver-major。不关闭 security updates；安全更新仍走 Dependabot 默认行为。
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: maven
    directory: "/apps/api"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - maven
    commit-message:
      prefix: chore(deps)
    ignore:
      # 同上：仅忽略版本更新中的 semver-major，不影响安全更新。
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
